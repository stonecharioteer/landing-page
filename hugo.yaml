baseURL: "https://www.stonecharioteer.com/"
languageCode: "en-us"
title: "Stonecharioteer"
theme: "PaperMod"
outputs:
  home:
    - HTML
    - RSS
    - JSON # necessary for search
ignoreLogs:
  - "warning-partial-superfluous-prefix"
  - "warning-goldmark-raw-html"
markup:
  goldmark:
    renderer:
      unsafe: true
params:
  defaultTheme: light
  disableThemeToggle: true
  ShowReadingTime: true
  ShowWordCount: true
  profileMode:
    enabled: true
    title: "Vinay Keerthi (stonecharioteer)" # optional default will be site title
    subtitle: "A life of reading, programming, writing and pet-parenting"
    imageUrl: "/logo.jpeg" # optional
    imageTitle: "Stonecharioteer Logo" # optional
    imageWidth: 240 # custom size
    imageHeight: 240 # custom size
    buttons:
      - name: Resume
        url: "https://github.com/stonecharioteer/resume/releases"
      - name: GitHub Timeline
        url: "https://git.stonecharioteer.com"
      - name: Tech Blog
        url: "https://tech.stonecharioteer.com"
      - name: Internet RFCs
        url: "https://rfc.stonecharioteer.com"
      - name: Rust Koans
        url: "https://rust-koans.stonecharioteer.com"
      - name: Merrilin
        url: "https://merrilin.ai"
  mainSections: ["writing", "reading", "cooking"]
menus:
  main:
    - name: Writing
      pageRef: /writing
      weight: 10
    - name: Cooking
      pageRef: /cooking
      weight: 12
    - name: Blog
      url: "https://tech.stonecharioteer.com"
      weight: 15
    - name: Reading
      pageRef: /reading
      weight: 20
    - name: Swimming
      pageRef: /pages/swimming-journey
      weight: 25
    - name: Nope
      pageRef: /nope
      weight: 30
    - name: No Social Media
      pageRef: /no-social-media
      weight: 40
