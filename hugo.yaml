baseURL: "https://www.stonecharioteer.com/"
languageCode: "en-us"
title: "Stonecharioteer"
theme: "PaperMod"
outputs:
  home:
    - HTML
    - RSS
    - JSON # necessary for search
ignoreLogs:
  - "warning-partial-superfluous-prefix"
  - "warning-goldmark-raw-html"
markup:
  goldmark:
    renderer:
      unsafe: true
params:
  defaultTheme: light
  disableThemeToggle: true
  ShowReadingTime: true
  ShowWordCount: true
  profileMode:
    enabled: true
    title: "Vinay Keerthi (stonecharioteer)" # optional default will be site title
    subtitle: "A life of reading, programming, writing and pet-parenting"
    imageUrl: "/logo.jpeg" # optional
    imageTitle: "Stonecharioteer Logo" # optional
    imageWidth: 240 # custom size
    imageHeight: 240 # custom size
  mainSections: ["writing", "reading", "cooking"]
menus:
  main:
    - name: Journal
      identifier: journal
      weight: 10
    - name: Writing
      pageRef: /writing
      parent: journal
      weight: 10
    - name: Cooking
      pageRef: /cooking
      parent: journal
      weight: 20
    - name: Reading
      pageRef: /reading
      parent: journal
      weight: 30
    - name: Swimming
      pageRef: /pages/swimming-journey
      parent: journal
      weight: 40
    - name: Search
      pageRef: /search
      weight: 15
    - name: Tech Blog
      url: "https://tech.stonecharioteer.com"
      weight: 20
    - name: Merrilin
      url: "https://merrilin.ai"
      pre: '<img class="menu-merrilin-icon" src="/images/merrilin/logo-nav.png" alt="" width="20" height="20" />'
      weight: 30
